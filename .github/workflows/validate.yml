name: Validate mod

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: |
          luac5.4 -p main.lua growth.lua engine_bridge.lua tests/growth_test.lua tests/bridge_test.lua tests/tmhm_test.lua
      - name: Run growth table tests
        run: lua5.4 tests/growth_test.lua
      - name: Run engine bridge regression tests
        run: lua5.4 tests/bridge_test.lua
      - name: Test partner TM/HM compatibility
          run: lua5.4 tests/tmhm_test.lua
      - name: Validate manifest metadata
        run: |
          python3 - <<'PY'
          import json, re
          m = json.load(open('manifest.json', encoding='utf-8'))
          assert m['id'] == 'pikachu_true_potential'
          assert m['games'] == ['yellow']
          assert m['entry'] == 'main.lua'
          assert re.fullmatch(r'\d+\.\d+\.\d+', m['version'])
          print('Manifest metadata valid')
          PY
      - name: Check release metadata consistency
        run: python3 tools/release_metadata.py
