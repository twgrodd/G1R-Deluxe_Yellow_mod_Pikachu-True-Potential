name: Release Pikachu True Potential

# Based on the release workflows in twgrodd's other G1R Deluxe mods.
# Intentionally manual while the partner-species integration is unfinished.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match manifest.json, e.g. 0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark this release as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: pikachu-true-potential-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and mod identity
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          with open('manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          version = str(manifest.get('version', ''))
          requested = os.environ['REQUESTED_VERSION'].strip()
          if manifest.get('id') != 'pikachu_true_potential':
              sys.exit('::error::Unexpected mod ID')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              sys.exit('::error::Manifest version must be X.Y.Z')
          if requested != version:
              sys.exit('::error::Requested version must match manifest.json')
          print('version=' + version)
          print('tag=v' + version)
          PY

      - name: Check that the release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi

      - name: Install Lua for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Test growth progression
        run: lua5.4 tests/growth_test.lua

      - name: Package installable mod
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$RUNNER_TEMP/pikachu_true_potential"
          mkdir -p "$stage"
          # Explicit allowlist prevents shipping tests, GitHub workflows, or ROMs.
          cp manifest.json main.lua growth.lua mod.card CHANGELOG.md README.md "$stage/"
          python3 - "$stage/manifest.json" "$VERSION" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['version'] == sys.argv[2]
          assert manifest['id'] == 'pikachu_true_potential'
          PY
          zip_path="$GITHUB_WORKSPACE/dist/pikachu_true_potential-$VERSION.zip"
          (cd "$stage" && zip -q "$zip_path" ./*)
          unzip -l "$zip_path"
          (cd dist && sha256sum "pikachu_true_potential-$VERSION.zip" > sha256sums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          notes="Install from MODS > Import mod .zip. See README.md for implementation status."
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Pikachu True Potential v$VERSION" \
            --notes "$notes" \
            "${args[@]}" \
            "dist/pikachu_true_potential-$VERSION.zip" \
            "dist/sha256sums.txt"
